<div class="saFieldAndLabelWrapper">
	<label class="saLabelCell">
		<div class="saLabel"><span>Colorpicker</span></div>
	</label>
	<div class="saFieldCell">
		<div class="saInputWrapper saMediumShortValidation">
			<div class="saInput">
				<div class="saInputTextWrapper saColorPickerField saInputPageField saHasLeadingIcon saHasTrailingIcons">
					<input class="saInputText">
					<div class="saLeadingIconWrapper">
						<button class="saColorPreview" aria-expanded="true" tabindex="-1" type="button"></button>
					</div>
					<div class="saTrailingIconsWrapper">
						<button class="saActionIcon" tabindex="-1" type="button">
							<i class="saIcon far fa-palette"></i>
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<div class="saPickerWrapperJs">
	<div class="saColorPicker saPicker saContextMenu saOpen saPopupItemJs saSouth">
		<div class="saColors">
			<fieldset class="saPalette">
				<input type="radio" class="saColor" style="background-color: rgb(248, 249, 251);">
				<input type="radio" class="saColor" style="background-color: rgb(229, 239, 255);">
				<input type="radio" class="saColor" style="background-color: rgb(255, 232, 231);">
				<input type="radio" class="saColor" style="background-color: rgb(255, 236, 183);">
				<input type="radio" class="saColor" style="background-color: rgb(214, 247, 217);">
				<input type="radio" class="saColor" style="background-color: rgb(196, 247, 255);">
				<input type="radio" class="saColor" style="background-color: rgb(221, 204, 255);">
				<input type="radio" class="saColor" style="background-color: rgb(255, 193, 237);">
				<input type="radio" class="saColor" style="background-color: rgb(143, 165, 192);">
				<input type="radio" class="saColor" style="background-color: rgb(45, 108, 225);">
				<input type="radio" class="saColor" style="background-color: rgb(224, 23, 62);">
				<input type="radio" class="saColor" style="background-color: rgb(0, 155, 54);">
				<input type="radio" class="saColor" style="background-color: rgb(158, 101, 255);">
				<input type="radio" class="saColor" style="background-color: rgb(49, 58, 68);">
			</fieldset>
			<fieldset class="saPalette saFooter">
				<input class="saColor saExtraColor saColorCustom" type="color" data-tooltip="Custom">
				<input type="radio" class="saColor saExtraColor saWhite" style="background-color: rgb(255, 255, 255);">
				<input type="radio" class="saColor saExtraColor saBlack" style="background-color: rgb(0, 0, 0);">
			</fieldset>
		</div>
	</div>
</div>
