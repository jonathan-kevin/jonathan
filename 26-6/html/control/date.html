<div class="saFieldAndLabelWrapper">
	<label class="saLabelCell">
		<div class="saLabel"><span>Date</span></div>
	</label>
	<div class="saFieldCell">
		<div class="saInputWrapper saMediumShortValidation">
			<div class="saInput">
				<div class="saInputTextWrapper saDateField saInputPageField saHasTrailingIcons">
					<div></div>
					<input class="saInputText saDate">
					<div class="saTrailingIconsWrapper">
						<button class="saActionIcon" tabindex="-1" type="button">
							<i class="saIcon far fa-calendar"></i>
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<div class="saPickerWrapperJs">
	<div class="saDatePicker saPicker saDatePickerRoot saManyWeeks saPopupItemJs saSouth" tabindex="0">
		<div class="saDatePickerMonthHeading">
			<div class="saMonthWrapper">
				<button class="saMonth" type="button" tabindex="-1">
					<span>March 2026</span>
					<i class="saIcon saIcon far fa-angle-down"></i>
				</button>
			</div>
			<div class="saMonthBrowser">
				<button type="button" tabindex="-1" data-tooltip="Previous month">
					<i class="saIcon saIcon far fa-angle-left"></i>
				</button>
				<button type="button" tabindex="-1" data-tooltip="Next month">
					<i class="saIcon saIcon far fa-angle-right"></i>
				</button>
			</div>
		</div>
		<div class="saDayRow">
			<div class="saWeekNr saEmpty"></div>
			<div class="saDay">Mon</div>
			<div class="saDay">Tue</div>
			<div class="saDay">Wed</div>
			<div class="saDay">Thu</div>
			<div class="saDay">Fri</div>
			<div class="saDay">Sat</div>
			<div class="saDay">Sun</div>
		</div>
		<div class="saDateRow">
			<div class="saWeekNr">12</div>
			<div class="saDate saDateElement">16</div>
			<div class="saDate saDateElement">17</div>
			<div class="saDate saDateElement">18</div>
			<div class="saDate saDateElement">19</div>
			<div class="saDate saDateElement">20</div>
			<div class="saDate saDateElement">21</div>
			<div class="saDate saDateElement">22</div>
		</div>
		<div class="saDateRow">
			<div class="saWeekNr">13</div>
			<div class="saDate saDateElement">23</div>
			<div class="saDate saDateElement saDateActive">24</div>
			<div class="saDate saDateElement">25</div>
			<div class="saDate saDateElement">26</div>
			<div class="saDate saDateElement">27</div>
			<div class="saDate saDateElement">28</div>
			<div class="saDate saDateElement">29</div>
		</div>
		<a class="saTodayLink saDateElement" role="button" tabindex="-1">Today</a>
	</div>
</div>
