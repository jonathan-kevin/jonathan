<div class="saFieldAndLabelWrapper">
	<label class="saLabelCell">
		<div class="saLabel"><span>DateTime</span></div>
	</label>
	<div class="saFieldCell">
		<div class="saInputWrapper saDateTimeValidation">
			<div class="saInput">
				<div class="saInputTextWrapper saDateTimeField saInputPageField saHasTrailingIcons">
					<div></div>
					<input class="saInputText saDateTime">
					<div class="saTrailingIconsWrapper">
						<button class="saActionIcon" tabindex="-1" type="button">
							<i class="saIcon far fa-calendar"></i>
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<div class="saPickerWrapperJs">
	<div class="saDateTimePickerWrapper saPicker saDatePickerRoot saManyWeeks saPopupItemJs saSouth" tabindex="0">
		<div class="saDateTimePicker">
			<div class="saDatePickerMonth">
				<div class="saDatePickerMonthHeading">
					<div class="saMonthWrapper">
						<button class="saMonth" type="button" tabindex="-1">
							<span>July 2026</span>
							<i class="saIcon saIcon far fa-angle-down"></i>
						</button>
					</div>
					<div class="saMonthBrowser">
						<button type="button" tabindex="-1" data-tooltip="Previous month">
							<i class="saIcon saIcon far fa-angle-left"></i>
						</button>
						<button type="button" tabindex="-1" data-tooltip="Next month">
							<i class="saIcon saIcon far fa-angle-right"></i>
						</button>
					</div>
				</div>
				<div class="saDayRow">
					<div class="saWeekNr saEmpty"></div>
					<div class="saDay">Mon</div>
					<div class="saDay">Tue</div>
					<div class="saDay">Wed</div>
					<div class="saDay">Thu</div>
					<div class="saDay">Fri</div>
					<div class="saDay">Sat</div>
					<div class="saDay">Sun</div>
				</div>
				<div class="saDateRow">
					<div class="saWeekNr">27</div>
					<div class="saDate saDateElement">29</div>
					<div class="saDate saDateElement">30</div>
					<div class="saDate saDateElement">1</div>
					<div class="saDate saDateElement">2</div>
					<div class="saDate saDateElement saToday saDateActive">3</div>
					<div class="saDate saDateElement">4</div>
					<div class="saDate saDateElement">5</div>
				</div>
				<div class="saDateRow">
					<div class="saWeekNr">28</div>
					<div class="saDate saDateElement">6</div>
					<div class="saDate saDateElement">7</div>
					<div class="saDate saDateElement">8</div>
					<div class="saDate saDateElement">9</div>
					<div class="saDate saDateElement">10</div>
					<div class="saDate saDateElement">11</div>
					<div class="saDate saDateElement">12</div>
				</div>
			</div>
			<div class="saTimeSlotPickerWrapper">
				<label>Time</label>
				<ul class="saTimeSlotPicker">
					<li class="saDatePickerSlot saDateElement">1200</li>
					<li class="saDatePickerSlot saDateElement">1230</li>
					<li class="saDatePickerSlot saDateElement">1300</li>
					<li class="saDatePickerSlot saDateElement saSelected">1330</li>
					<li class="saDatePickerSlot saDateElement">1400</li>
					<li class="saDatePickerSlot saDateElement">1430</li>
					<li class="saDatePickerSlot saDateElement">1500</li>
				</ul>
			</div>
		</div>
		<div class="saButtonRow">
			<button class="saDatePickerButton saButtonPrimary" type="button" tabindex="-1">Choose</button>
			<button class="saDatePickerButton saButtonSecondary" type="button" tabindex="-1">Cancel</button>
			<a class="saTodayLink saDateElement" role="button" tabindex="-1">Today</a>
		</div>
	</div>
</div>
