<div class="saFieldAndLabelWrapper">
	<label class="saLabelCell">
		<div class="saLabel"><span>File Upload Area</span></div>
	</label>
	<div class="saFieldCell">
		<div class="saInputWrapper saFileValidation">
			<div class="saInput">
				<div class="saInputPageField">
					<div class="saFileUploadAreaWrapper saMultipleFilesArea">
						<label class="saFileUploadArea" tabindex="0" role="button">
							<input type="file" multiple>
							<div class="saFileUploadAreaInner">
								<div class="saFolderWrapper">
									<div class="saFolder">
										<div class="saFolderBack"></div>
										<div class="saPaper"></div>
										<div class="saPaper"></div>
										<div class="saPaper"></div>
										<div class="saFolderFront">
											<i class="saEnabledIcon saIcon far fa-arrow-up"></i>
											<i class="saDisabledIcon saIcon far fa-xmark"></i>
										</div>
									</div>
								</div>
								<div class="saFileUploadAreaText">
									<span class="saFileUploadAreaHeading">Drop your files here, or <span class="saLink">browse</span></span>
								</div>
							</div>
						</label>
						<ul class="saFileGroup">
							<li class="saFileWrapper saFileVisible saDone">
								<div class="saFileIconWrapper saDone">
									<i class="saFileIcon saIcon fas fa-code"></i>
									<div class="saLoadingWrapper saLoadingDark">
										<svg class="saLoading" viewBox="0 0 24 24">
											<circle class="saLoadingCircle" cx="12" cy="12" r="12" fill="none"></circle>
											<path class="saLoadingCheck" d="M6.29,12.58l3.14,3.19c.15,.15,.39,.15,.53,0l7.75-7.8" fill="none"></path>
										</svg>
										<div class="saLoadingSpinner"></div>
									</div>
								</div>
								<div class="saFile">
									<div class="saFileNameWrapper">
										<span class="saFileName">pattern_b_interactive_demo.html</span>
									</div>
									<div class="saFileSizeWrapper">
										<div class="saFileSizeRow">
											<span class="saFileSize">13 kB</span>
											<span class="saFileUploadProgressText">100%</span>
										</div>
										<progress class="saFileUploadProgress" max="100" value="100"></progress>
										<span class="saFileErrorMessage" role="alert"></span>
									</div>
								</div>
								<div class="saFileButtonGroup">
									<button class="saDeleteButton saDestructive" type="button" data-tooltip="Delete file">
										<i class="saIcon far fa-trash-alt"></i>
									</button>
								</div>
							</li>
							<li class="saFileWrapper saFileVisible">
								<div class="saFileIconWrapper">
									<i class="saFileIcon saIcon fas fa-file-zipper"></i>
									<div class="saLoadingWrapper saLoadingDark">
										<svg class="saLoading" viewBox="0 0 24 24">
											<circle class="saLoadingCircle" cx="12" cy="12" r="12" fill="none"></circle>
											<path class="saLoadingCheck" d="M6.29,12.58l3.14,3.19c.15,.15,.39,.15,.53,0l7.75-7.8" fill="none"></path>
										</svg>
										<div class="saLoadingSpinner"></div>
									</div>
								</div>
								<div class="saFile">
									<div class="saFileNameWrapper">
										<span class="saFileName">vagga-.zip</span>
									</div>
									<div class="saFileSizeWrapper">
										<div class="saFileSizeRow">
											<span class="saFileSize">72 MB</span>
											<span class="saFileUploadProgressText">25%</span>
										</div>
										<progress class="saFileUploadProgress" max="100" value="25"></progress>
										<span class="saFileErrorMessage" role="alert"></span>
									</div>
								</div>
								<div class="saFileButtonGroup">
									<button class="saDeleteButton saDestructive" type="button" data-tooltip="Cancel file">
										<i class="saIcon far fa-ban"></i>
									</button>
								</div>
							</li>
							<li class="saFileWrapper saFileVisible">
								<div class="saFileIconWrapper saPending">
									<i class="saFileIcon saIcon fas fa-video"></i>
									<div class="saLoadingWrapper saLoadingDark">
										<svg class="saLoading" viewBox="0 0 24 24">
											<circle class="saLoadingCircle" cx="12" cy="12" r="12" fill="none"></circle>
											<path class="saLoadingCheck" d="M6.29,12.58l3.14,3.19c.15,.15,.39,.15,.53,0l7.75-7.8" fill="none"></path>
										</svg>
										<div class="saLoadingSpinner"></div>
									</div>
								</div>
								<div class="saFile">
									<div class="saFileNameWrapper">
										<span class="saFileName">vagga-.mp4</span>
									</div>
									<div class="saFileSizeWrapper">
										<div class="saFileSizeRow">
											<span class="saFileSize">72 MB</span>
											<span class="saFileUploadProgressText">0%</span>
										</div>
										<progress class="saFileUploadProgress" max="100" value="0"></progress>
										<span class="saFileErrorMessage" role="alert"></span>
									</div>
								</div>
								<div class="saFileButtonGroup">
									<button class="saDeleteButton saDestructive" type="button" data-tooltip="Cancel file">
										<i class="saIcon far fa-ban"></i>
									</button>
								</div>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
