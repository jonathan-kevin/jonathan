<fieldset class="saSectionWrapper saLastVisible">
	<legend class="saSectionHeaderWrapper">
		<button class="saSectionHeader saInputPageField" type="button" aria-expanded="true">
			<div class="saSectionHeaderLabel">Heading (Collapsible)</div>
			<i class="far fa-angle-up saIcon"></i>
		</button>
	</legend>
	<fieldset class="saFieldCollection mediumLong">
		<div class="saFieldAndLabelWrapper">
			<label class="saLabelCell">
				<div class="saLabel"><span>Child Under Heading</span></div>
			</label>
			<div class="saFieldCell">
				<div class="saInputWrapper mediumLong">
					<div class="saInput">
						<div class="saInputTextWrapper saInputPageField mediumLong">
							<input class="saInputText" maxlength="200">
						</div>
					</div>
				</div>
			</div>
		</div>
	</fieldset>
</fieldset>

<fieldset class="saSectionWrapper saLastVisible">
	<legend class="saSectionHeaderWrapper">
		<button class="saSectionHeader saInputPageField" type="button" aria-expanded="false">
			<div class="saSectionHeaderLabel">Heading (Collapsible)</div>
			<i class="far fa-angle-up saIcon saClosed"></i>
		</button>
	</legend>
	<fieldset class="saFieldCollection mediumLong">
		<div class="saFieldAndLabelWrapper">
			<label class="saLabelCell saHiddenControl">
				<div class="saLabel"><span>Child Under Heading</span></div>
			</label>
			<div class="saFieldCell saHiddenControl">
				<div class="saInputWrapper mediumLong">
					<div class="saInput">
						<div class="saInputTextWrapper saInputPageField mediumLong">
							<input class="saInputText" maxlength="200">
						</div>
					</div>
				</div>
			</div>
		</div>
	</fieldset>
</fieldset>
