<div class="saFieldAndLabelWrapper">
	<label class="saLabelCell" aria-atomic="true">
		<div class="saLabel">
			<span>MultiPicker</span>
		</div>
	</label>
	<div class="saFieldCell">
		<div class="saInputWrapper saMultiPickerValidation mediumLong">
			<div class="saInput">
				<div class="saMultiPickerWrapper saInputPageField mediumLong" id="MI_MC_MultiPicker">
					<fieldset class="saMultiPicker" style="height: 242px;">
						<div class="saTreeWrapper saMultiPickerTreeWrapper" role="tree" aria-multiselectable="true">
							<div class="saCheckboxTree">
								<fieldset>
									<label class="saCheckboxWrapper" data-sa-node-id="1" data-sa-selectable="1">
										<input class="saCheckbox" type="checkbox" tabindex="-1">
										<span tabindex="0" role="treeviewitem" aria-selected="false">Label 1</span>
									</label>
									<div class="saCheckboxOuter saOpen" data-sa-node-id="2" data-sa-selectable="1">
										<label class="saCheckboxWrapper">
											<input class="saCheckbox" type="checkbox" tabindex="-1">
											<span tabindex="-1" role="treeviewitem" aria-expanded="true" aria-selected="true">Label 2</span>
										</label>
										<button class="saExpandButton saClosed" type="button" tabindex="-1">
											<i class="saIcon far fa-angle-down"></i>
										</button>
									</div>
									<div class="saCheckboxTreeInner">
										<div class="saCheckboxOuter" data-sa-node-id="3" data-sa-selectable="0">
											<label class="saCheckboxWrapper">
												<input class="saCheckbox" type="checkbox" tabindex="-1" disabled="">
												<span tabindex="-1" role="treeviewitem" aria-expanded="false" aria-selected="false">Label 3</span>
											</label>
											<button class="saExpandButton saClosed" type="button" tabindex="-1">
												<i class="saIcon far fa-angle-down"></i>
											</button>
										</div>
										<label class="saCheckboxWrapper" data-sa-node-id="4" data-sa-selectable="0">
											<input class="saCheckbox" type="checkbox" tabindex="-1" disabled="">
											<span tabindex="-1" role="treeviewitem" aria-selected="true">Label 4</span>
										</label>
									</div>
									<div class="saCheckboxOuter" data-sa-node-id="16" data-sa-selectable="1">
										<label class="saCheckboxWrapper">
											<input class="saCheckbox" type="checkbox" tabindex="-1">
											<span tabindex="-1" role="treeviewitem" aria-expanded="false" aria-selected="true">Label 16</span>
										</label>
										<button class="saExpandButton saClosed" type="button" tabindex="-1">
											<i class="saIcon far fa-angle-down"></i>
										</button>
									</div>
								</fieldset>
							</div>
						</div>
						<div class="saMultiPickerSelected">
							<div class="saMultiPickerInner" tabindex="0">
								<fieldset>
									<legend class="saNumberOfCheckedWrapper">
										<span>3 chosen</span>
									</legend>
									<div class="saMultiPickerItem">
										<button class="saDeleteButton" type="button" tabindex="-1">
											<i class="saIcon far fa-xmark"></i>
										</button>
										<label>
											<input type="checkbox" tabindex="-1">
											<span>Label 16</span>
										</label>
									</div>
									<div class="saMultiPickerItem saNextIsSelected">
										<button class="saDeleteButton" type="button" tabindex="-1">
											<i class="saIcon far fa-xmark"></i>
										</button>
										<label>
											<input type="checkbox" tabindex="-1">
											<span>Label 4</span>
										</label>
									</div>
									<div class="saMultiPickerItem">
										<button class="saDeleteButton" type="button" tabindex="-1">
											<i class="saIcon far fa-xmark"></i>
										</button>
										<label>
											<input type="checkbox" tabindex="-1">
											<span>Label 2</span>
										</label>
									</div>
								</fieldset>
							</div>
							<div class="saMultiPickerButtons"></div>
						</div>
					</fieldset>
				</div>
			</div>
		</div>
	</div>
</div>
