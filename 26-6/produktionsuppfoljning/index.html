<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bancroft - Visa produktion</title>
  <link rel="stylesheet" href="../Presentation/CssTemplate/screen.template.css">
  <link rel="stylesheet" href="../../src/fontawesome/css/all.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body class="saRootBody saLargeScreen saPc saCompact saLargeScreenHasTopButtons saSmallScreenHasTopButtons production-demo">
  <div class="saRootContentWrapper">
    <aside id="sidebar" class="saAside saSideBarOuter">
      <nav class="saSideBar saExpanded" aria-label="Sidomeny">
        <section class="saSideBarSection saSideBarHeader">
          <img class="saCustomerLogo" src="konserthuset.png" alt="Konserthuset Stockholm">
          <ul class="saSideBarInputGroup"><li><div class="saLabeled saImpersonator"><label class="saLabel" for="demo-user">Användare</label><input id="demo-user" class="saInputText" value="Emma Lindholm - Produktionsledare" readonly></div></li></ul>
        </section>
        <section class="saSideBarSection saSideBarBody">
          <div class="saSideBarGroup"><h3>Meny</h3><ul class="saItemList">
            <li><a class="saItem" href="#all/overview" data-route="overview" data-production="all"><div class="saItemInner"><div class="saIconWrapper"><i class="far fa-house saIcon"></i></div><span>Startsida</span></div></a></li>
            <li><a class="saItem" href="#all/productions" data-route="productions"><div class="saItemInner"><div class="saIconWrapper"><i class="far fa-users saIcon"></i></div><span>Produktioner</span></div></a></li>
            <li><a class="saItem" href="#all/costs" data-route="costs" data-production="all"><div class="saItemInner"><div class="saIconWrapper"><i class="far fa-dollar-sign saIcon"></i></div><span>Kvitton och tillägg</span></div></a></li>
            <li><a class="saItem" href="#all/time" data-route="time" data-production="all"><div class="saItemInner"><div class="saIconWrapper"><i class="far fa-calendar-lines-pen saIcon"></i></div><span>Schema &amp; genomförande</span></div></a></li>
          </ul></div>
          <div class="saSideBarGroup"><h3>Uppföljning</h3><ul class="saItemList">
            <li><a class="saItem" href="#bancroft/overview" data-route="overview" data-production="bancroft"><div class="saItemInner"><div class="saIconWrapper"><i class="far fa-chart-column saIcon"></i></div><span>Visa produktion</span></div></a></li>
            <li><a class="saItem" href="#all/staff" data-route="staff" data-production="all"><div class="saItemInner"><div class="saIconWrapper"><i class="far fa-user-group saIcon"></i></div><span>Resursutnyttjande</span></div></a></li>
            <li><a class="saItem" href="#all/deviations" data-route="deviations" data-production="all"><div class="saItemInner"><div class="saIconWrapper"><i class="far fa-triangle-exclamation saIcon"></i></div><span>Avvikelser</span></div></a></li>
          </ul></div>
        </section>
        <section class="saSideBarSection saSideBarFooter">
          <div class="saSideBarFooterPrimary"><div class="saListItem"><button class="saAccountDropdown" type="button" data-about><div class="saAccountAvatar">EL</div><span class="saAccountName">Emma Lindholm</span><i class="far fa-angle-down saIcon"></i></button></div><ul class="saSideBarToolbar"><li><button type="button" data-print title="Skriv ut rapport" aria-label="Skriv ut rapport"><div class="saIconWrapper"><i class="far fa-print saIcon"></i></div></button></li><li><button type="button" data-about title="Definitioner och demounderlag" aria-label="Definitioner och demounderlag"><div class="saIconWrapper"><i class="far fa-circle-question saIcon"></i></div></button></li></ul></div>
          <div class="saSideBarFooterSecondary"><a class="saSoftadminLogo" href="https://www.multisoft.se/softadmin/" target="_blank" rel="noopener"><img class="saLogo" src="../Presentation/img/softadmin-logo-minimized.svg" alt=""><img class="saWordmark" src="../Presentation/img/softadmin-logo-expanded.svg" alt="Softadmin"></a><button class="saExpander" type="button" id="collapse-sidebar" aria-label="Minimera menyn" title="Minimera menyn" aria-expanded="true"><i class="far fa-angles-left saIcon"></i></button></div>
        </section>
      </nav>
    </aside>
    <button id="nav-backdrop" hidden aria-label="Stäng menyn"></button>
    <main id="workspace" class="interface" aria-label="Arbetsyta">
      <header id="pageheader" class="saPageHeaderHolder"></header>
      <div class="scrollcontent"><div class="scrollcontent-inner">
        <div id="context"></div>
        <div id="view"></div>
        <footer class="demo-footnote">Fiktivt demounderlag · 22 september 2026 · <button type="button" data-about>Definitioner och beräkningsunderlag</button></footer>
      </div></div>
    </main>
  </div>
  <dialog id="detail" aria-labelledby="detail-title"><header class="dialog-heading"><h2 id="detail-title"></h2><button type="button" class="saGridButton" id="close-detail" title="Stäng" aria-label="Stäng"><i class="far fa-xmark saIcon"></i></button></header><div id="detail-body" class="interface"></div></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
