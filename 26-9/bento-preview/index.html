<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Bento preview · Softadmin</title>
 <link rel="icon" href="../../src/img/favicon.svg">
 <link rel="stylesheet" href="../Presentation/CssTemplate/screen.template.css?v=bento-appearance-cards-2">
 <link rel="stylesheet" href="../../src/fontawesome/css/all.css"><link rel="stylesheet" href="../../src/fontawesome/css/duotone-regular.css">
 <script src="../bento-layouts.js?v=spotlight-default" defer></script>
 <script src="bento-model.js?v=bento-appearance-cards-2" defer></script>
 <script src="bento.js?v=bento-appearance-cards-2" defer></script>
</head>
<body class="saBentoEditorPage saCompact saPc">
 <main class="saBentoEditor">
  <section class="saBentoWorkspace" aria-label="Grid workspace">
   <header class="saBentoEditorToolbar">
    <div class="saBentoToolbarHeading"><h1>Bento preview</h1><span id="viewport-description"></span></div>
    <div class="saBentoToolbarControls">
     <div class="saBentoBreakpointBar" id="breakpoint-bar" role="group" aria-label="Preview breakpoint"></div>
     <div class="saActionLinks saBentoPreviewActions">
      <label class="saInputTextWrapper saBentoWidthInput"><input class="saInputText" id="preview-width" type="number" aria-label="Preview width in pixels"><span>px</span></label>
      <button class="saDefaultButtonSecondary" id="fit-screen" type="button" title="Set screen width to available workspace">Fit</button>
      <button class="saDefaultButtonSecondary" id="max-width-toggle" type="button" aria-pressed="false" aria-controls="preview-frame" title="Limit the card grid to its maximum width"><i class="saIcon far fa-arrows-left-right-to-line" aria-hidden="true"></i>Max width</button>
      <button class="saDefaultButtonSecondary" id="grid-lines-toggle" type="button" aria-pressed="false" aria-controls="preview-frame"><i class="saIcon far fa-border-all" aria-hidden="true"></i>Grid lines</button><button class="saDefaultButtonSecondary" id="breakpoint-guides-toggle" type="button" aria-pressed="false" aria-controls="breakpoint-guides" title="Show breakpoint start widths on the preview"><i class="saIcon far fa-arrow-down-to-dotted-line" aria-hidden="true"></i>Breakpoints</button>
     </div>
    </div>
   </header>
   <div class="saBentoCanvasArea" id="canvas-area" tabindex="-1">
    <div class="saBentoPreviewHolder" id="preview-holder" role="region" aria-label="Simulated screen">
     <div class="saBentoScreenHeader">
      <div class="saBentoWindowControls" aria-hidden="true"><i class="saIcon far fa-arrow-left"></i><i class="saIcon far fa-arrow-right"></i><i class="saIcon far fa-arrow-rotate-right"></i></div>
      <div class="saBentoScreenAddress"><i class="saIcon far fa-lock" aria-hidden="true"></i><span id="screen-size" aria-label="Simulated screen width"></span></div>
      <div class="saBentoWindowControls" aria-hidden="true"><i class="saIcon far fa-minus"></i><i class="saIcon far fa-clone"></i><i class="saIcon far fa-xmark"></i></div>
     </div>
     <iframe class="saBentoPreviewFrame" id="preview-frame" src="bento-canvas.html?v=bento-appearance-cards-2" title="Start page layout preview"></iframe>
     <div class="saBentoBreakpointGuides" id="breakpoint-guides" role="group" aria-label="Breakpoint guides" hidden></div>
     <button class="saBentoScreenResizer" id="screen-resizer" type="button" role="slider" aria-label="Resize screen width" aria-orientation="horizontal" aria-valuemin="320" aria-valuemax="3840" aria-valuenow="1536" aria-controls="preview-frame" title="Drag to resize · Arrow keys adjust width"><i class="saIcon far fa-arrows-left-right" aria-hidden="true"></i></button>
    </div>
   </div>
  </section>
  <aside class="saBentoInspector" aria-label="Layout and card settings">
   <div class="saBentoInspectorTitle"><h2 id="inspector-heading">Layout settings</h2><button class="saDefaultIconButtonGhost saBentoIconButton" id="panel-toggle" type="button" aria-label="Minimize settings panel" aria-expanded="true" aria-controls="panel-content"><span data-icon="minimize"></span></button></div>
   <div class="saBentoPanelContent" id="panel-content">
    <div class="saActionLinks saBentoPanelActions"><button class="saDefaultButtonPrimary" id="add-card" type="button"><span data-icon="plus"></span>Add card</button><div class="saBentoHistoryActions"><button class="saDefaultIconButtonGhost saBentoIconButton" id="undo" type="button" title="Undo (Ctrl/⌘ Z)" aria-label="Undo"><span data-icon="undo"></span></button><button class="saDefaultIconButtonGhost saBentoIconButton" id="redo" type="button" title="Redo (Ctrl/⌘ Shift Z)" aria-label="Redo"><span data-icon="redo"></span></button></div></div>
    <section class="saBentoInspectorSection" id="grid-settings"><div class="saBentoSectionLabel"><span data-icon="grid"></span><h3>Grid</h3></div><div id="grid-controls"></div></section>
    <section class="saBentoPresetPanel" id="preset-panel" aria-label="Layout presets"><div class="saBentoPanelHeading"><h2>Layout presets</h2></div><p class="saBentoPanelDescription">Choose a starting point, then make it yours.</p><div class="saBentoPresetGallery" id="preset-gallery"></div></section>
    <div id="card-inspector" hidden></div>
    <details class="saBentoInheritanceOverview" id="inheritance-overview"><summary class="saBentoSharedSummary">Across breakpoints</summary><div id="inheritance-table"></div></details>
    <details class="saBentoInspectorSection" id="all-card-controls"><summary class="saBentoSharedSummary">All card settings</summary><div id="all-card-fields"></div></details>
    <details class="saBentoInspectorSection" id="card-appearance" hidden><summary class="saBentoSharedSummary">Appearance</summary><div id="card-appearance-fields"></div></details>
    <section class="saBentoInheritanceNote"><h3>Desktop first</h3><p>Values flow to smaller screens until overridden.</p><div class="saBentoInheritanceChain" aria-label="Inheritance direction"><b>2xl</b><span>→</span><b>xl</b><span>→</span><b>lg</b><span>→</span><b>md</b><span>→</span><b>sm</b><span>→</span><b>xs</b></div><button class="saDefaultButtonSecondary saBentoClearMemory" id="clear-memory" type="button"><i class="saIcon far fa-rotate-left" aria-hidden="true"></i>Clear memory</button></section>
   </div>
  </aside>
 </main>
</body>
</html>
