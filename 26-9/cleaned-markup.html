<body class="right standardview saLargeScreen saPc saCompact">
  <div class="pagecontentframe">
    <div class="interface">

        <ul class="saAccessibilityBanner">
          <li><a>Gå till innehåll</a></li>
          <li><a>Gå till meny</a></li>

      <header class="saPageHeaderHolder">

            <div class="saRowWrapper">
              <div class="saTopRow">
                <nav class="saBreadcrumbs" aria-label="Brödsmulor">

                      aria-label="Stäng: Ny cat"
                    >
                      <i class="far fa-arrow-left saBack saIcon"></i>
                    </button>
                  </div>
                  <span class="saBreadcrumb" hidden

                    <div>
                      <ul class="saContextMenu">
                        <li class="saOptionWrapper" hidden>
                          <a

                              <span class="saOptionText">Alligatores</span>
                            </div></a

                        </li>
                      </ul>
                    </div></span
                  ><span class="saBreadcrumb"><a>Alligatores</a></span>
                </nav>
              </div>
              <div class="saBottomRow">
                <div class="saTitle">
                  <h1 class="saHeaderText">Ny cat</h1>
                  <div class="saNoSpinner">
                    <button
                      type="button"
                      aria-label="Spara favorit"
                      class="saFavoriteToggle"
                    >
                      <i class="saIcon far fa-star" aria-hidden="true"></i
                      ><i class="saIcon fas fa-star" aria-hidden="true"></i>
                    </button>
                  </div>
                  <ul class="saSpecialLinksWrapper"></ul>
                </div>
                <div class="saToolbox saNoSpinner saOpen">
                  <ul>
                    <li class="saAdminTopLink">
                      <button
                        class="saToolboxButton"
                        type="button"
                        aria-label="Open SQL Editor"
                      >
                        <i class="far fa-file-code icon saIcon"></i>
                      </button>
                    </li>
                    <li class="saAdminTopLink">
                      <button
                        class="saToolboxButton"
                        type="button"
                        aria-label="Edit this menu item"
                      >
                        <i class="far fa-pen icon saIcon"></i>
                      </button>
                    </li>
                    <li class="saAdminTopLink">
                      <button
                        class="saToolboxButton"
                        type="button"
                        aria-label="Field information for this menu item"
                      >
                        <i class="far fa-input-pipe icon saIcon"></i>
                      </button>
                    </li>
                    <li class="saAdminTopLink">
                      <button
                        class="saToolboxButton"
                        type="button"
                        aria-label="Parameters for this menu item"
                      >
                        <i class="far fa-filter icon saIcon"></i>
                      </button>
                    </li>
                    <li class="saAdminTopLink">
                      <button
                        class="saToolboxButton"
                        type="button"
                        aria-label="Links to and from this menu item"
                      >
                        <i class="far fa-link icon saIcon"></i>
                      </button>
                    </li>
                    <li class="saAdminTopLink">
                      <button
                        class="saToolboxButton"
                        type="button"
                        aria-label="Inspect this menu item"
                      >
                        <i class="far fa-triangle-exclamation icon saIcon"></i>
                      </button>
                    </li>
                    <li class="saAdminTopLink">
                      <button
                        class="saToolboxButton"
                        type="button"
                        aria-label="Softadmin® Documentation"
                      >
                        <i class="far fa-book icon saIcon"></i>
                      </button>
                    </li>
                    <li class="saAdminTopLink">
                      <button
                        class="saToolboxButton"
                        type="button"
                        aria-label="Profiler log"
                      >
                        <i class="far fa-calendar-clock icon saIcon"></i>
                      </button>
                    </li>
                    <li class="saAdminTopLink">
                      <button
                        class="saToolboxButton"
                        type="button"
                        aria-label="New menu item with link from this menu item"
                      >
                        <i class="far fa-square-arrow-up-right icon saIcon"></i>
                      </button>
                    </li>
                    <li class="saAdminTopLink">
                      <button
                        class="saToolboxButton"
                        type="button"
                        aria-label="Guides"
                      >
                        <i class="far fa-wand-magic-sparkles icon saIcon"></i>
                      </button>
                    </li>
                    <li class="saExternalTool">
                      <button
                        class="saToolboxButton"
                        type="button"
                        aria-label="External tools"
                      >
                        <i class="saIcon fas fa-toolbox" aria-hidden="true"></i>
                      </button>
                    </li>
                    <li class="saDebug">
                      <button class="saToolboxButton" type="button">
                        <i class="fas fa-bug saIcon"></i>
                      </button>
                    </li>
                  </ul>
                  <button
                    class="saExpandButton saToolboxButton"
                    type="button"
                  ></button>
                </div>
              </div>
              <nav class="saNavigationBar" hidden></nav>
            </div>
          </div>
        </div>
        <div class="saPageHeader saSmallScreenHeader">
          <div class="saHeader">
            <div class="saHeaderInner">
              <div class="saTopRow">
                <button
                  class="saSmallScreenBackButton saButtonHeader"
                  type="button"
                  aria-label="Stäng: Ny cat"
                >
                  <i class="far fa-arrow-left saBack saIcon"></i>
                </button>
                <div class="saHeaderWrapper">
                  <div class="saTitle">
                    <h1 class="saHeaderText">Ny cat</h1>
                  </div>
                </div>
                <button
                  class="saNotifications saButtonHeader"
                  type="button"
                  aria-label="Notifieringar"
                >
                  <i class="far fa-bell saIcon" aria-hidden="true"></i>
                  <div class="saBadgeCount saUrgent saEmpty">0</div></button
                ><button
                  class="saNavigator saButtonHeader"
                  type="button"
                  aria-label="Öppna meny"
                >
                  <div class="saNavBar"><i class="saIcon far fa-bars"></i></div>
                </button>
              </div>
            </div>
            <nav class="saBottomRow saActionLinkBar" hidden></nav>
          </div>
        </div>
      </header>

      <div class="maincolinner gradients">
        <div hidden class="saSpinnerWrapper">
          <span aria-hidden="true" hidden></span>
        </div>

        <main class="menuitem pagecontentframe">
          <div class="scrollindicator"></div>
          <div class="scrollcontent saScrollable">
            <div class="scrollcontent-inner">
              <div class="maincolbody saInputPage">
                <div>
                  <div class="saErrorSummaryHolder">
                    <div class="saErrorSummaryWrapper" hidden>
                      <div class="saErrorSummaryHeadingWrapper">
                        <i class="saIcon fas fa-octagon-xmark"></i>
                        <h3 class="saErrorSummaryHeading">
                          Lös följande fel för att fortsätta:
                        </h3>
                      </div>
                      <button
                        class="saErrorSummaryCloseButton"
                        type="button"
                        aria-label="Stäng felsammanfattning"
                      >
                        <i class="saIcon far fa-xmark"></i>
                      </button>
                      <ul class="saErrorSummary"></ul>
                    </div>
                  </div>
                  <div class="saFormRootAndTocWrapper">
                    <fieldset class="saFormRoot saLabelsAbove">
                      <div class="saSectionWrapper saLastVisible">
                        <div class="saFieldsRow">
                          <div class="saFieldsColumn saLastVisible">
                            <div class="saSectionWrapper saLastVisible">
                              <div class="saFieldCollection mediumLong">
                                <div class="saFieldAndLabelWrapper">
                                  <label class="saLabelCell"
                                    ><div class="saLabel">
                                      <span class="saMandatory"
                                        >name<span
                                          class="saMandatoryStar"
                                          aria-label="krävs"
                                          >*</span
                                        ></span
                                      >
                                    </div></label
                                  >
                                  <div class="saFieldCell">
                                    <div class="saInputWrapper mediumLong">
                                      <div class="saInput">
                                        <div
                                          class="saInputTextWrapper saInputPageField mediumLong"
                                        >
                                          <input
                                            class="saInputText"
                                            maxlength="500"
                                            required
                                          />
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                                <div class="saFieldAndLabelWrapper">
                                  <label class="saLabelCell"
                                    ><div class="saLabel">
                                      <span>Missing label: Breed</span>
                                    </div></label
                                  >
                                  <div class="saFieldCell">
                                    <div class="saInputWrapper mediumLong">
                                      <div class="saInput">
                                        <div
                                          class="saInputAffixWrapper saInputPageField mediumLong"
                                        >
                                          <div class="saInputAffixText">
                                            STOP
                                          </div>
                                          <input
                                            class="saInputAffix"
                                            maxlength="5000"
                                            dir="rtl"
                                          />
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                                <div class="saFieldAndLabelWrapper">
                                  <label class="saLabelCell"
                                    ><div class="saLabel">
                                      <span>Missing label: Age</span>
                                    </div></label
                                  >
                                  <div class="saFieldCell">
                                    <div class="saInputWrapper mediumLong">
                                      <div class="saInput">
                                        <div
                                          class="saInputTextWrapper saInputPageField mediumLong"
                                        >
                                          <input
                                            class="saInputText"
                                            inputmode="numeric"
                                          />
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                                <div class="saFieldAndLabelWrapper">
                                  <label class="saLabelCell"
                                    ><div class="saLabel">
                                      <span>Färgen på katten</span>
                                    </div></label
                                  >
                                  <div class="saFieldCell">
                                    <div class="saInputWrapper mediumLong">
                                      <div class="saInput">
                                        <div
                                          class="saInputTextWrapper saInputPageField mediumLong"
                                        >
                                          <input
                                            class="saInputText"
                                            maxlength="30"
                                          />
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                                <div class="saFieldAndLabelWrapper">
                                  <label class="saLabelCell"
                                    ><div class="saLabel">
                                      <span>Missing label: Toyss</span>
                                    </div></label
                                  >
                                  <div class="saFieldCell">
                                    <div class="saInputWrapper mediumLong">
                                      <div class="saInput">
                                        <div
                                          class="saInputPageField saMultiRowWrapper"
                                        >
                                          <fieldset aria-label="Toyss">
                                            <div class="saMultiRowTableWrapper">
                                              <div class="saMultiRow">
                                                <div
                                                  class="saMultiRowHeadGroup"
                                                >
                                                  <div class="saMultiRowHead">
                                                    <div
                                                      class="saMultiRowCellWrapper"
                                                    >
                                                      <div
                                                        class="saMultiRowCell"
                                                      >
                                                        <label
                                                          class="saLabelWrapper"

                                                            <span>ID</span>
                                                          </div></label
                                                        >
                                                      </div>
                                                    </div>
                                                    <div
                                                      class="saMultiRowCellWrapper"
                                                    >
                                                      <div

                                                        <label

                                                            <span>Toy</span>
                                                          </div></label

                                                      </div>
                                                    </div>
                                                    <div
                                                      class="saMultiRowCellWrapper"
                                                    >
                                                      <div
                                                        class="saMultiRowCell"
                                                      >
                                                        <label
                                                          class="saLabelWrapper"
                                                          ><div class="saLabel">
                                                            <span
                                                              >Färgen på
                                                              katten</span
                                                            >
                                                          </div></label
                                                        >
                                                      </div>
                                                    </div>
                                                    <div
                                                      class="saMultiRowCellWrapper"
                                                    ></div>
                                                  </div>
                                                </div>
                                                <div
                                                  class="saMultiRowRowsGroup"
                                                >
                                                  <div class="saMultiRowRow">
                                                    <div
                                                      class="saMultiRowCellWrapper"
                                                    >
                                                      <div
                                                        class="saMultiRowCell"
                                                      >
                                                        <div
                                                          class="saMultiRowInputWrapper mediumLong"
                                                        >
                                                          <div
                                                            class="saInputTextWrapper saMultiRowField mediumLong"
                                                          >
                                                            <input
                                                              class="saInputText"
                                                              inputmode="numeric"
                                                            />
                                                          </div>
                                                        </div>
                                                      </div>
                                                    </div>
                                                    <div
                                                      class="saMultiRowCellWrapper"
                                                    >
                                                      <div
                                                        class="saMultiRowCell"
                                                      >
                                                        <div
                                                          class="saMultiRowInputWrapper mediumLong"
                                                        >
                                                          <div
                                                            class="saInputTextWrapper saMultiRowField mediumLong"

                                                            <input

                                                        </div>
                                                      </div>
                                                    </div>
                                                    <div

                                                      <div

                                                        <div
                                                          class="saMultiRowInputWrapper mediumLong"

                                                          <div

                                                        </div>
                                                      </div>
                                                    </div>
                                                    <div
                                                      class="saMultiRowCellWrapper"
                                                    >
                                                      <div
                                                        class="saMultiRowCell"
                                                      >
                                                        <ul
                                                          class="saMultiRowButtons"
                                                        >
                                                          <li>
                                                            <button

                                                              <i
                                                                class="saIcon far fa-trash-alt"

                                                  <div

                                                      <div

                                                          <div

                                                        </div>
                                                      </div>
                                                    </div>
                                                    <div

                                                    >
                                                      <div
                                                        class="saMultiRowCell"

                                                        <div
                                                          class="saMultiRowInputWrapper mediumLong"
                                                        >
                                                          <div
                                                            class="saInputTextWrapper saMultiRowField mediumLong"
                                                          >
                                                            <input

                                                              maxlength="100"
                                                            />
                                                          </div>
                                                        </div>
                                                      </div>
                                                    </div>
                                                    <div
                                                      class="saMultiRowCellWrapper"
                                                    >
                                                      <div
                                                        class="saMultiRowCell"
                                                      >
                                                        <div
                                                          class="saMultiRowInputWrapper mediumLong"
                                                        >
                                                          <div
                                                            class="saInputTextWrapper saMultiRowField mediumLong"

                                                            <input

                                                            />

                                                        </div>
                                                      </div>
                                                    </div>
                                                    <div
                                                      class="saMultiRowCellWrapper"

                                                      <div
                                                        class="saMultiRowCell"
                                                      >
                                                        <ul
                                                          class="saMultiRowButtons"
                                                        >
                                                          <li>
                                                            <button
                                                              class="saIconOnlyFieldButton saDestructive"
                                                              type="button"

                                                                class="saIcon far fa-trash-alt"
                                                                aria-hidden="true"
                                                              ></i>
                                                            </button>
                                                          </li>
                                                        </ul>
                                                      </div>
                                                    </div>
                                                  </div>
                                                  <div
                                                    class="saMultiRowRow saMultiRowAggregateRow"
                                                    hidden
                                                  >
                                                    <div
                                                      class="saMultiRowCellWrapper saMultiRowAggregateCellWrapper"
                                                    >
                                                      <div
                                                        class="saMultiRowCell saMultiRowAggregateCell"
                                                      ></div>
                                                    </div>
                                                    <div
                                                      class="saMultiRowCellWrapper saMultiRowAggregateCellWrapper"
                                                      aria-hidden="true"
                                                    >
                                                      <div
                                                        class="saMultiRowCell saMultiRowAggregateCell"

                                                    </div>

                                                      class="saMultiRowCellWrapper saMultiRowAggregateCellWrapper"

                                                      <div
                                                        class="saMultiRowCell saMultiRowAggregateCell"
                                                      ></div>

                                                      aria-hidden="true"
                                                      hidden

                                                      <div
                                                        class="saMultiRowCell saMultiRowAggregateCell"
                                                      ></div>
                                                    </div>
                                                  </div>
                                                </div>
                                              </div>
                                            </div>
                                            <button

                                              type="button"

                                              <i
                                                class="saIcon far fa-plus"

                                              ></i
                                              >Ny rad
                                            </button>
                                          </fieldset>
                                        </div>
                                      </div>
                                    </div>

                                  <label class="saLabelCell"
                                    ><div class="saLabel">
                                      <span>Missing label: AdoptedDate</span>
                                    </div></label
                                  >
                                  <div class="saFieldCell">
                                    <div
                                      class="saInputWrapper saMediumShortValidation mediumLong"
                                    >
                                      <div class="saInput">
                                        <div
                                          class="saInputTextWrapper saDateField saInputPageField saHasTrailingIcons"
                                        >
                                          <input class="saInputText saDate" />
                                          <div class="saTrailingIconsWrapper">
                                            <button
                                              class="saActionIcon"
                                              type="button"
                                            >
                                              <i
                                                class="saIcon far fa-calendar"
                                              ></i>
                                            </button>
                                          </div>
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                                <div class="saFieldAndLabelWrapper">
                                  <label class="saLabelCell"
                                    ><div class="saLabel">
                                      <span>Missing label: IsIndoor</span>
                                    </div></label
                                  >
                                  <div class="saFieldCell">
                                    <div class="saInputWrapper mediumLong">
                                      <div class="saInput">
                                        <div
                                          class="saInputTextWrapper saInputPageField mediumLong"
                                        >
                                          <textarea
                                            class="saInputText saTextArea"
                                            rows="5"
                                          ></textarea>
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                                <div class="saFieldAndLabelWrapper">
                                  <label class="saLabelCell"
                                    ><div class="saLabel">
                                      <span>Missing label: MRAppender</span>
                                    </div></label
                                  >
                                  <div class="saFieldCell">
                                    <div class="saInputWrapper mediumLong">
                                      <div class="saInput">
                                        <div
                                          class="saInputTextWrapper saInputPageField mediumLong"
                                        >
                                          <input
                                            class="saInputText"
                                            maxlength="1000"
                                          />
                                        </div>
                                        <div class="saJavaScriptButtons">
                                          <button
                                            class="saLabeledFieldButton saJavaScriptButton"
                                            type="button"
                                          >
                                            <span class="saButtonText"
                                              >App (</span
                                            >
                                          </button>
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </fieldset>
                  </div>
                </div>

                <div class="saInputPageFooter">
                  <div class="saFormButtonGroup">
                    <button class="saFormButton saButtonPrimary" type="button">
                      <i class="icon fas fa-spin fa-spinner saSpinner"></i
                      >Spara</button
                    ><button
                      class="saFormButton saButtonSecondary"
                      type="button"
                    >
                      <i class="icon fas fa-spin fa-spinner saSpinner"></i
                      >Avbryt
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
